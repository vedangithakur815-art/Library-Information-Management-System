<!DOCTYPE html>
<html>
<head>

    <title>Library Information Management System</title>
</head>
<style>
    body {
        color: black;
    }
      .save-btn {
            background-color: #4caf68;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    .save-btn:hover {
            background-color: #388E3C;
        }
</style>
<body>

    <h1>Welcome to our Library</h1>

    <form method="POST" action="{% url 'save_student' %}">
        {% csrf_token %}

        <label style="color:red;display:inline-block;font-size: 20px;"for="student_name">Student Name:</label>

        <input
            type="text"
            id="student_name"
            name="student_name"
            placeholder="Enter Student Name"
            required
        ><br><br>
          <label style="color:blue;display:inline-block;font-size: 20px;"for="student_age">Student Age:</label>

        <input
            type="text"
            id="student_age"
            name="student_age"
            placeholder="Enter Student Age"
            required
        >
        <br><br>
        <button type="submit" style="display:block;;width: 260px;" class="save-btn">Save</button>
    </form>

    <br>

</body>
</html>
